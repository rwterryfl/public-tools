kind: ConfigMap
apiVersion: v1
metadata:
  name: vector-aggregator-app
  namespace: vector-aggregator
data:
  vector.yaml: |
    data_dir: /vector-data-dir
    sinks:
      blackhole:
        inputs:
        - json_parser_message
        type: blackhole
      prometheus_output:
        address: '[::]:24231'
        default_namespace: vector-aggregator
        flush_period_secs: 3600
        inputs:
        - internal_metrics
        - pod_log_counter
        type: prometheus_exporter
    sources:
      http_server:
        address: 0.0.0.0:8080
        type: http_server
      internal_metrics:
        type: internal_metrics
    transforms:
      json_parser_message:
        inputs:
        - http_server
        source: |
          . = parse_json!(string!(.message))
        type: remap
      pod_log_counter:
        inputs:
        - json_parser_message
        metrics:
        - field: message
          name: pod_log_counter
          namespace: aggregator
          tags:
            container_name: '{{ kubernetes.container_name }}'
            namespace_name: '{{ kubernetes.namespace_name }}'
            pod_name: '{{ kubernetes.pod_name }}'
          type: counter
        type: log_to_metric
