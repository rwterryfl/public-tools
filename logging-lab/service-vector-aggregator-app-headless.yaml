kind: Service
apiVersion: v1
metadata:
  name: vector-aggregator-app-headless
  namespace: vector-aggregator
  labels:
    app.kubernetes.io/component: Aggregator
    app.kubernetes.io/instance: vector-aggregator-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vector
    app.kubernetes.io/version: 0.43.0-distroless-libc
    helm.sh/chart: vector-0.38.0
spec:
  clusterIP: None
  ipFamilies:
    - IPv4
  ports:
    - name: prometheus-output
      protocol: TCP
      port: 24231
      targetPort: 24231
    - name: http-server
      protocol: TCP
      port: 8080
      targetPort: 8080
  internalTrafficPolicy: Cluster
  clusterIPs:
    - None
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app.kubernetes.io/component: Aggregator
    app.kubernetes.io/instance: vector-aggregator-app
    app.kubernetes.io/name: vector
status:
  loadBalancer: {}
